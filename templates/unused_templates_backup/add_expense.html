<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تسجيل مصروف</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5" style="max-width: 500px;">
    <div class="card shadow">
        <div class="card-header bg-warning"><h5>تسجيل مصروف جديد</h5></div>
        <div class="card-body">
            <form method="POST">
                <div class="mb-3">
                    <label>بند المصروف</label>
                    <select name="category_id" class="form-select">
                        {% for c in categories %}
                        <option value="{{ c.id }}">{{ c.name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="mb-3">
                    <label>القيمة (ج.م)</label>
                    <input type="number" step="0.5" name="amount" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label>الوصف / ملاحظات</label>
                    <input type="text" name="description" class="form-control">
                </div>
                <button class="btn btn-primary w-100">حفظ</button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
