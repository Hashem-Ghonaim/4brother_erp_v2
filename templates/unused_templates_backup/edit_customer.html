<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تعديل بيانات العميل</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-header bg-warning">
                    <h4 class="mb-0 fw-bold text-dark">تعديل بيانات العميل</h4>
                </div>
                <div class="card-body p-4">
                    <form method="POST">
                        <div class="mb-3">
                            <label class="form-label fw-bold">اسم العميل</label>
                            <input type="text" name="name" class="form-control" value="{{ customer.name }}" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">رقم الهاتف</label>
                            <input type="text" name="phone" class="form-control" value="{{ customer.phone }}" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">العنوان</label>
                            <input type="text" name="address" class="form-control" value="{{ customer.address }}">
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">ملاحظات إضافية</label>
                            <textarea name="notes" class="form-control" rows="3">{{ customer.notes }}</textarea>
                        </div>
                        
                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-primary fw-bold">حفظ التعديلات</button>
                            <a href="/customers" class="btn btn-secondary">إلغاء</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
