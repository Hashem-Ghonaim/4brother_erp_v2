<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تقرير الإقفال (Z-Report)</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>body{background:#333; color:white; padding:20px; text-align:center;}</style>
</head>
<body>
    <div class="container bg-white text-dark p-4 rounded shadow" style="max-width: 500px;">
        <h3>Z-REPORT (إقفال يومي)</h3>
        <p>التاريخ: {{ date }}</p>
        <hr>
        <div class="d-flex justify-content-between my-2">
            <span>مبيعات كاش:</span> <strong>{{ total_cash }} ج.م</strong>
        </div>
        <div class="d-flex justify-content-between my-2">
            <span>مبيعات فيزا:</span> <strong>{{ total_visa }} ج.م</strong>
        </div>
        <div class="alert alert-success mt-3">
            <h4>الإجمالي: {{ total_sales }} ج.م</h4>
        </div>
        <hr>
        <h6>ملخص العمليات:</h6>
        <ul class="list-group text-end">
            {% for o in orders %}
            <li class="list-group-item d-flex justify-content-between">
                <span>فاتورة #{{ o.id }} ({{ o.payment_method }})</span>
                <span>{{ o.final_total }}</span>
            </li>
            {% endfor %}
        </ul>
        <br>
        <button onclick="window.print()" class="btn btn-dark w-100">طباعة التقرير</button>
        <a href="/pos" class="btn btn-outline-secondary w-100 mt-2">رجوع</a>
    </div>
</body>
</html>
