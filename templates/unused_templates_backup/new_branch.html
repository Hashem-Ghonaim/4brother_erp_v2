<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إضافة فرع جديد</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #f4f6f9; font-family: 'Segoe UI', Tahoma, sans-serif; }
        .card { border-radius: 15px; border: none; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
    </style>
</head>
<body>

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card p-4">
                <div class="d-flex justify-content-between align-items-center mb-4 border-bottom pb-3">
                    <h3 class="fw-bold text-primary"><i class="fas fa-store-alt"></i> افتتاح فرع جديد</h3>
                    <a href="/" class="btn btn-secondary rounded-pill"><i class="fas fa-arrow-left"></i> رجوع للرئيسية</a>
                </div>

                <form method="POST">
                    <h5 class="text-muted mb-3"><i class="fas fa-map-marker-alt"></i> بيانات الفرع</h5>
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label class="form-label fw-bold">اسم الفرع</label>
                            <input type="text" name="name" class="form-control" placeholder="مثال: فرع وسط البلد" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">العنوان / الموقع</label>
                            <input type="text" name="location" class="form-control" placeholder="مثال: شارع طلعت حرب" required>
                        </div>
                    </div>

                    <hr class="my-4">

                    <div class="alert alert-info border-0 d-flex align-items-center">
                        <i class="fas fa-user-tie fa-2x me-3"></i>
                        <div>
                            <h5 class="mb-1 fw-bold">تعيين مدير للفرع</h5>
                            <small>سيتم إنشاء حساب للمدير تلقائياً لإدارة هذا الفرع.</small>
                        </div>
                    </div>

                    <div class="row mb-4">
                        <div class="col-md-6">
                            <label class="form-label fw-bold">اسم المستخدم (للمدير)</label>
                            <input type="text" name="manager_username" class="form-control" placeholder="Username" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">كلمة المرور</label>
                            <input type="password" name="manager_password" class="form-control" placeholder="Password" required>
                        </div>
                    </div>

                    <div class="d-grid">
                        <button type="submit" class="btn btn-success btn-lg fw-bold shadow-sm">
                            <i class="fas fa-check-circle"></i> حفظ وإنشاء الفرع
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
