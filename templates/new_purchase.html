<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>فاتورة مشتريات جديدة</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #f8f9fa; font-family: 'Segoe UI', Tahoma, sans-serif; }
        .invoice-box { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 0 20px rgba(0,0,0,0.05); }
        .table-input { width: 100%; border: none; background: transparent; text-align: center; }
        .table-input:focus { outline: 2px solid #0d6efd; background: #fff; }

        /* تنسيق Select2 */
        .select2-container--default .select2-selection--single { border: none; background: transparent; text-align: right; }
        .select2-container .select2-selection--single .select2-selection__rendered { padding-right: 0; color: #333; }
        .cat-cell .select2-container--default .select2-selection--single { background-color: #f8f9fa; border-radius: 4px; }
        
        /* إخفاء العناصر عند الطباعة */
        @media print {
            .no-print { display: none !important; }
            .invoice-box { box-shadow: none; border: 1px solid #ddd; }
            body { background-color: white; }
        }
    </style>
</head>
<body>

<div class="container mt-4 mb-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h3><i class="fas fa-cart-plus text-success"></i> فاتورة مشتريات جديدة</h3>
        <a href="/inventory" class="btn btn-secondary no-print">عودة للمخزن</a>
    </div>

    <form action="/purchases/new" method="POST" enctype="multipart/form-data" class="invoice-box">

        <div class="row g-3 mb-4 bg-light p-3 rounded">
            <div class="col-md-4">
                <label class="form-label fw-bold">اختر المورد</label>
                <select name="supplier_id" class="form-select" id="supplierSelect" onchange="toggleNewSupplier()">
                    <option value="">-- اختر مورد --</option>
                    {% for s in suppliers %}
                    <option value="{{ s.id }}">{{ s.name }}</option>
                    {% endfor %}
                    <option value="new" class="fw-bold text-primary">+ مورد جديد</option>
                </select>
            </div>

            <div class="col-md-8 row g-2" id="newSupplierInputs" style="display:none;">
                <div class="col-6">
                    <label class="form-label fw-bold">اسم المورد الجديد</label>
                    <input type="text" name="new_supplier_name" class="form-control">
                </div>
                <div class="col-6">
                    <label class="form-label fw-bold">رقم الهاتف</label>
                    <input type="text" name="new_supplier_phone" class="form-control">
                </div>
            </div>
        </div>

        <div class="table-responsive">
            <table class="table table-bordered text-center align-middle" id="itemsTable">
                <thead class="table-dark">
                    <tr>
                        <th width="20%">اسم الصنف</th>
                        <th width="15%">التصنيف</th>
                        <th width="10%">الموسم</th>
                        <th width="10%">باركود</th>
                        <th width="10%">التكلفة</th>
                        <th width="10%">البيع</th>
                        <th width="10%">الكمية</th>
                        <th width="10%" class="no-print">صورة</th>
                        <th width="5%" class="no-print"></th>
                    </tr>
                </thead>
                <tbody id="tbody">
                    </tbody>
            </table>
        </div>

        <div class="mt-3 d-flex justify-content-between align-items-center">
            <button type="button" class="btn btn-outline-primary no-print" onclick="addRow()">
                <i class="fas fa-plus"></i> إضافة صنف
            </button>
        </div>

        <div class="row mt-4 p-3 bg-light border rounded text-center">
            <div class="col-md-6 border-start">
                <h6 class="text-muted fw-bold">إجمالي عدد القطع</h6>
                <h2 class="text-primary fw-bold m-0" id="totalQtyDisplay">0</h2>
            </div>
            <div class="col-md-6">
                <h6 class="text-muted fw-bold">إجمالي المبلغ (التكلفة)</h6>
                <h2 class="text-success fw-bold m-0" id="totalCostDisplay">0.00 <small class="fs-6 text-dark">ج.م</small></h2>
            </div>
        </div>

        <div class="d-flex justify-content-end align-items-center mt-4 gap-2">
            <button type="button" class="btn btn-secondary btn-lg px-4 no-print" onclick="window.print()">
                <i class="fas fa-print"></i> طباعة الفاتورة
            </button>
            <button type="submit" class="btn btn-success btn-lg px-5 fw-bold shadow-sm no-print">
                <i class="fas fa-save"></i> حفظ الفاتورة
            </button>
        </div>

    </form>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>

<script>
    // 1. تجهيز البيانات من السيرفر (كما هي)
    const productSuggestions = [
        {% for p in product_suggestions %}
            {
                id: "{{ p.id }}",
                name: "{{ p.model.name }}",
                category: "{{ p.model.category.name }}",
                barcode: "{{ p.barcode if p.barcode else '' }}",
                cost: "{{ p.cost_price }}",
                sell: "{{ p.sell_price }}"
            },
        {% endfor %}
    ];

    const categoriesList = [
        {% for c in categories %}
            "{{ c.name }}",
        {% endfor %}
    ];

    // خوارزمية البحث المخصصة (كما هي)
    function matchCustom(params, data) {
        if ($.trim(params.term) === '') return data;
        if (typeof data.text === 'undefined') return null;

        var term = params.term.toLowerCase();
        var text = data.text.toLowerCase();

        // بحث بالاسم
        if (text.indexOf(term) > -1) return data;

        // بحث بالكود (ID)
        var id = $(data.element).data('id');
        if (id && id.toString() === term) return data;
        if (id && id.toString().indexOf(term) > -1) return data;

        // بحث بالباركود
        var barcode = $(data.element).data('barcode');
        if (barcode && barcode.toString().toLowerCase().indexOf(term) > -1) return data;

        return null;
    }

    $(document).ready(function() {
        if ($('#tbody tr').length === 0) {
            addRow();
        }
    });

    function toggleNewSupplier() {
        var val = document.getElementById('supplierSelect').value;
        document.getElementById('newSupplierInputs').style.display = (val === 'new') ? 'flex' : 'none';
    }

    // دالة إضافة صف (مع تعديل بسيط لإضافة حدث oninput للحساب)
    function addRow() {
        let lastCategory = 'عام';
        const lastRow = $('#tbody tr:last');
        if (lastRow.length > 0) {
            const val = lastRow.find('.cat-select').val();
            if (val) lastCategory = val;
        }

        let productOptions = '<option></option>';
        productSuggestions.forEach(p => {
            let displayText = `${p.name} [كود: ${p.id}] (${p.category})`;
            productOptions += `<option value="${p.name}"
                                data-id="${p.id}"
                                data-cat="${p.category}"
                                data-barcode="${p.barcode}"
                                data-cost="${p.cost}"
                                data-sell="${p.sell}">
                                ${displayText}
                               </option>`;
        });

        let catOptions = '<option value="عام">عام</option>';
        categoriesList.forEach(c => {
            if(c !== 'عام') catOptions += `<option value="${c}">${c}</option>`;
        });

        var row = `
        <tr class="item-row">
            <td>
                <select class="product-select" style="width: 100%;" onchange="fillProductData(this)">
                    ${productOptions}
                </select>
                <input type="hidden" name="name[]" class="real-name-input">
                <input type="hidden" name="product_id[]" class="hidden-id-input">
            </td>
            <td class="cat-cell">
                <select name="category[]" class="cat-select" style="width: 100%;">
                    ${catOptions}
                </select>
            </td>
            <td>
                <select name="season[]" class="form-select form-select-sm" style="min-width: 75px;">
                    <option value="صيفي">صيفي</option>
                    <option value="شتوي">شتوي</option>
                </select>
            </td>
            <td><input type="text" name="barcode[]" class="table-input barcode-input" placeholder="Scan"></td>
            <td><input type="number" step="0.5" name="cost[]" class="table-input cost-input" placeholder="0.0" oninput="calculateTotals()"></td>
            <td><input type="number" step="0.5" name="sell[]" class="table-input sell-input" placeholder="0.0"></td>
            <td><input type="number" name="qty[]" class="table-input qty-input" placeholder="0" required style="background:#e8f0fe; font-weight:bold;" oninput="calculateTotals()"></td>
            <td class="no-print"><input type="file" name="image[]" class="form-control form-control-sm"></td>
            <td class="no-print"><button type="button" class="btn btn-danger btn-sm" onclick="removeRow(this)">x</button></td>
        </tr>`;

        var newRow = $(row).appendTo('#tbody');

        initProductSelect2(newRow.find('.product-select'));
        var newCatSelect = newRow.find('.cat-select');
        initCategorySelect2(newCatSelect);

        if (lastCategory) {
            if (newCatSelect.find("option[value='" + lastCategory + "']").length > 0) {
                newCatSelect.val(lastCategory).trigger('change');
            } else {
                var newOption = new Option(lastCategory, lastCategory, true, true);
                newCatSelect.append(newOption).trigger('change');
            }
        }
    }

    function initProductSelect2(element) {
        element.select2({
            placeholder: "ابحث بالاسم أو الكود...",
            tags: true,
            allowClear: true,
            language: "ar",
            dir: "rtl",
            matcher: matchCustom
        });

        element.on('select2:select', function (e) {
            fillProductData(this);
        });

        element.on('change', function() {
            const val = $(this).val();
            const tr = $(this).closest('tr');
            tr.find('.real-name-input').val(val);

            if (!val) {
                tr.find('.hidden-id-input').val("");
            }
        });
    }

    function initCategorySelect2(element) {
        element.select2({
            placeholder: "اختر...",
            tags: true,
            language: "ar",
            dir: "rtl"
        });
    }

    function removeRow(btn) {
        if($('#tbody tr').length > 1) {
            $(btn).closest('tr').remove();
            calculateTotals(); // إعادة الحساب عند الحذف
        } else alert("يجب إدخال صنف واحد على الأقل");
    }

    function fillProductData(selectElement) {
        var option = $(selectElement).find(':selected');
        var tr = $(selectElement).closest('tr');

        var pid = option.data('id');
        var cat = option.data('cat');
        var cost = option.data('cost');
        var sell = option.data('sell');
        var barcode = option.data('barcode');

        tr.find('.real-name-input').val($(selectElement).val());
        tr.find('.hidden-id-input').val(pid || "");

        if (cat) {
            var catSelect = tr.find('.cat-select');
            if (catSelect.find("option[value='" + cat + "']").length) {
                catSelect.val(cat).trigger('change.select2');
            } else {
                var newOption = new Option(cat, cat, true, true);
                catSelect.append(newOption).trigger('change.select2');
            }
        }

        if (cost) tr.find('.cost-input').val(cost);
        if (sell) tr.find('.sell-input').val(sell);
        if (barcode && barcode !== 'None') tr.find('.barcode-input').val(barcode);
        
        calculateTotals(); // تحديث الحسابات عند ملء البيانات تلقائياً
    }

    $(document).on('change', '.cat-select', function() {
        var tr = $(this).closest('tr');
        var currentId = tr.find('.hidden-id-input').val();

        if (currentId !== "") {
            tr.find('.hidden-id-input').val("");
        }
    });

    // === دالة حساب المجاميع (الإضافة الجديدة) ===
    function calculateTotals() {
        let totalQty = 0;
        let totalCost = 0;

        $('.item-row').each(function() {
            let qty = parseInt($(this).find('.qty-input').val()) || 0;
            let cost = parseFloat($(this).find('.cost-input').val()) || 0;

            totalQty += qty;
            totalCost += (qty * cost);
        });

        $('#totalQtyDisplay').text(totalQty);
        $('#totalCostDisplay').text(totalCost.toFixed(2));
    }
</script>

</body>
</html>
